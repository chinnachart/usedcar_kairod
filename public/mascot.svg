<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 310">
  <!-- เสือไว แบบเต็มตัว: วิ่ง ชูนิ้วโป้ง ถือกุญแจรถ -->
  <defs>
    <g id="spot"><circle r="3.2" fill="#8a4b00"/></g>
  </defs>
  <!-- speed lines -->
  <g stroke="#ff7a00" stroke-width="7" stroke-linecap="round">
    <path d="M8 180h30M2 200h26M12 220h22"/>
  </g>
  <!-- tail (behind body, right side) -->
  <path d="M150 232c34 10 58 0 66-24" fill="none" stroke="#ffb03a" stroke-width="13" stroke-linecap="round"/>
  <path d="M214 214c2-4 3-8 3-12" fill="none" stroke="#14171f" stroke-width="13" stroke-linecap="round"/>
  <g fill="#8a4b00"><circle cx="178" cy="238" r="3"/><circle cx="198" cy="230" r="3"/></g>

  <!-- back leg (bent backward) -->
  <path d="M110 236l-22 26l-22-4" fill="none" stroke="#f59e1f" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="58" cy="256" rx="17" ry="10" fill="#1e2a44" transform="rotate(-12 58 256)"/>
  <path d="M46 262h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- front leg (forward) -->
  <path d="M140 236l22 22l-4 26" fill="none" stroke="#ffb03a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="166" cy="288" rx="19" ry="11" fill="#1e2a44"/>
  <path d="M152 295h28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="126" cy="200" rx="44" ry="50" fill="#ffb03a"/>
  <ellipse cx="128" cy="208" rx="27" ry="34" fill="#fff4e3"/>
  <g fill="#8a4b00"><circle cx="94" cy="190" r="3.5"/><circle cx="100" cy="214" r="3"/><circle cx="158" cy="196" r="3.5"/><circle cx="154" cy="222" r="3"/><circle cx="96" cy="234" r="2.5"/></g>
  <!-- blue scarf / bandana -->
  <path d="M92 160q34 18 68 0l-4 14q-30 14-60 0z" fill="#0b5cff"/>
  <path d="M140 170l14 22l-20-6z" fill="#0847c7"/>

  <!-- left arm holding car key -->
  <path d="M90 180l-30 14l-12-16" fill="none" stroke="#ffb03a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(40 150) rotate(-20)">
    <rect x="-9" y="-2" width="18" height="26" rx="7" fill="#14171f"/>
    <circle cx="0" cy="8" r="3.5" fill="#ff7a00"/>
    <rect x="-3" y="-20" width="6" height="20" fill="#c9d1de"/>
    <rect x="3" y="-14" width="5" height="4" fill="#c9d1de"/>
    <rect x="3" y="-8" width="4" height="3" fill="#c9d1de"/>
  </g>
  <circle cx="46" cy="174" r="12" fill="#ffb03a"/>

  <!-- right arm thumbs up -->
  <path d="M162 184l28-10l6-28" fill="none" stroke="#ffb03a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="198" cy="140" r="14" fill="#ffb03a"/>
  <rect x="193" y="112" width="10" height="22" rx="5" fill="#ffb03a"/>
  <path d="M189 136h18M189 144h18" stroke="#e08a12" stroke-width="2.5" stroke-linecap="round"/>

  <!-- head (same as head logo) -->
  <g transform="translate(26 -14)">
    <circle cx="52" cy="62" r="20" fill="#ffb03a"/><circle cx="52" cy="62" r="10" fill="#ff7a00"/>
    <circle cx="148" cy="62" r="20" fill="#ffb03a"/><circle cx="148" cy="62" r="10" fill="#ff7a00"/>
    <ellipse cx="100" cy="110" rx="62" ry="56" fill="#ffb03a"/>
    <ellipse cx="100" cy="132" rx="38" ry="28" fill="#fff4e3"/>
    <g fill="#8a4b00"><circle cx="58" cy="100" r="4"/><circle cx="66" cy="88" r="3"/><circle cx="142" cy="100" r="4"/><circle cx="134" cy="88" r="3"/><circle cx="50" cy="116" r="3"/><circle cx="150" cy="116" r="3"/></g>
    <path d="M46 80c4-32 28-46 54-46s50 14 54 46z" fill="#0b5cff"/>
    <path d="M100 80h64c4 0 6 5 2 7-14 5-38 5-66 1z" fill="#0847c7"/>
    <text x="100" y="70" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="30" fill="#fff" text-anchor="middle">R</text>
    <ellipse cx="80" cy="104" rx="9" ry="11" fill="#14171f"/><ellipse cx="120" cy="104" rx="9" ry="11" fill="#14171f"/>
    <circle cx="83" cy="99" r="3.5" fill="#fff"/><circle cx="123" cy="99" r="3.5" fill="#fff"/>
    <path d="M72 114q-4 6-6 10M128 114q4 6 6 10" stroke="#8a4b00" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="64" cy="128" rx="8" ry="5" fill="#ff9ec4" opacity=".7"/><ellipse cx="136" cy="128" rx="8" ry="5" fill="#ff9ec4" opacity=".7"/>
    <path d="M93 120h14l-7 8z" fill="#14171f"/>
    <path d="M84 132q16 16 32 0" fill="#c2410c" stroke="#14171f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
