<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@700&display=swap" rel="stylesheet"><style>
body{margin:0;font-family:'Noto Sans Thai',sans-serif;background:#f3f6fb;padding:24px;width:1000px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.c{background:#fff;border-radius:16px;padding:20px;text-align:center}.big img{height:360px}

.av{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:16px}
.av div{border-radius:50%;overflow:hidden;background:#e8f0ff;display:grid;place-items:center}
.dark{background:#0f1420;border-radius:12px;padding:10px}.dark .w{color:#fff}
h3{margin:0 0 6px}
</style></head><body>

<p>ป้ายโฆษณา / โพสต์</p>
<div class="lock" style="background:#0b5cff;border-radius:12px;padding:12px"><img src="mascot-b-full.svg" style="height:110px"><span class="w" style="color:#fff;font-size:22px">ขายรถไว ได้ราคาดี</span></div>
